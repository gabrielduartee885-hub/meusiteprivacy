<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Confirmado | Privacy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="img/favicon.png" id="favicon">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
        }

        .success-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        .privacy-logo-large {
            max-width: 250px;
            margin-bottom: 40px;
        }

        .success-title {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            margin-bottom: 30px;
            align-self: flex-start;
        }

        .success-message {
            font-size: 16px;
            color: #1a1a1a;
            line-height: 1.6;
            text-align: left;
            width: 100%;
        }

        .back-button {
            margin-top: 40px;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: white;
            border-radius: var(--radius-md);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }

        .back-button:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>

<body>


    <div class="success-container">
        <img src="img/logo-full.png" alt="Privacy" class="privacy-logo-large"
            onerror="this.src='https://privacy-images.s3.amazonaws.com/brand/logo/logo-full.png'; this.onerror=null; this.parentElement.innerHTML='<h1 class=\'logo\' style=\'font-size: 48px; margin-bottom: 40px;\'>privacy</h1>'">

        <h1 class="success-title">Pagamento Confirmado - Privacy</h1>

        <p class="success-message" id="successMessage">
            Recebemos a confirmação de sua compra, o perfil do criador já está disponível em nossa plataforma!
        </p>

        <!-- <a href="/" class="back-button">Voltar para Home</a> -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Load Site Settings for Favicon
            const siteSettings = JSON.parse(localStorage.getItem('privacySiteSettings'));
            if (siteSettings && siteSettings.favicon) {
                const favicon = document.getElementById('favicon');
                if (favicon) favicon.href = siteSettings.favicon;
            }

            // Get parameters from URL
            const urlParams = new URLSearchParams(window.location.search);
            const creatorName = urlParams.get('name');
            const creatorUsername = urlParams.get('username');

            if (creatorName && creatorUsername) {
                const messageEl = document.getElementById('successMessage');
                messageEl.innerHTML = `Recebemos a confirmação de sua compra, o perfil do criador <strong>${creatorName}</strong> (@${creatorUsername}) já está disponível em nossa plataforma!`;
            }
        });
    </script>
</body>

</html>
