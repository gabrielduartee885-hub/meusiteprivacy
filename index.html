<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy - Top Creators</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/favicon.png" id="favicon">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">privacy<span>.</span></a>
            <div class="header-actions">
                <button class="search-btn"><i class="fas fa-search"></i></button>
                <button class="notification-btn"><i class="fas fa-bell"></i></button>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="hero-banner">
        <div class="hero-overlay">
            <h1>Em alta.</h1>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Ofertas de Assinatura -->
        <section class="creators-section">
            <div class="section-header">
                <h2><i class="fas fa-bolt" style="color: #f59e0b;"></i> Ofertas de assinatura</h2>
                <button class="see-all"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="creators-scroll" id="offers-list">
                <!-- Populated by JavaScript -->
            </div>
        </section>

        <!-- Top Creators -->
        <section class="creators-section">
            <div class="section-header">
                <h2>Top creators</h2>
                <button class="see-all"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="creators-scroll top-creators" id="top-creators-list">
                <!-- Populated by JavaScript -->
            </div>
        </section>

        <!-- Perfis Gratuitos -->
        <section class="creators-section">
            <div class="section-header">
                <h2>Perfis gratuitos</h2>
                <button class="see-all"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="creators-scroll" id="free-profiles-list">
                <!-- Populated by JavaScript -->
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item">
            <i class="fas fa-th-large"></i>
            <span>Mural</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-newspaper"></i>
            <span>Feed</span>
        </a>
        <a href="index.html" class="nav-item active">
            <i class="fas fa-fire"></i>
            <span>Em alta</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-comment"></i>
            <span>Chat</span>
        </a>
        <a href="admin.html" class="nav-item">
            <i class="fas fa-bars"></i>
            <span>Menu</span>
        </a>
    </nav>

    <script src="js/home.js"></script>
</body>

</html>
